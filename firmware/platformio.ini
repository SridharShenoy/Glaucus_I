; Glaucus I MCU firmware.
;
; DESIGN CHOICE: Teensy 4.1 (600 MHz, FPU, lots of serial/I2C, native USB).
; An STM32 Nucleo or ESP32-S3 works too - only hal_*.cpp should change.
;
; Build:   pio run -e teensy41
; Flash:   pio run -e teensy41 -t upload
; Monitor: pio device monitor   (binary protocol - use tools/mcu_console.py instead)

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
  -std=gnu++17
  -Wall
  -I../shared/protocol
  ; Which hull side are we on? Mirrors the heading sign. +1 = starboard, -1 = port.
  ; TODO(glaucus): make this a runtime field in CommandPacket instead of a build flag.
  -DGLAUCUS_HULL_SIDE=1
build_unflags = -std=gnu++14
lib_deps =
  ; TODO(glaucus): pin once hardware is chosen, e.g.
  ; adafruit/Adafruit BNO08x
  ; bluerobotics/BlueRobotics MS5837 Library
monitor_speed = 115200
